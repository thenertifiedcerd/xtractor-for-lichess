<!DOCTYPE html>

<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Xtractor for Lichess™</title>

    <style>

        body { font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif; max-width: 600px; height: 100vh; margin: 2rem auto; padding: 0 1rem; line-height: 1.6; color: white; background: linear-gradient(to bottom, #2e2a24, #22201b 60px);}

        .container { border: 1px solid #ccc; padding: 2rem; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }

        label { display: block; margin-bottom: 0.5rem; font-weight: bold; }

        input { width: 100%; padding: 0.5rem; margin-bottom: 1rem; box-sizing: border-box; }

        button { background-color: #22201b; color: white; border: none; padding: 0.75rem 1.5rem; cursor: pointer; border-radius: 4px; font-size: 1rem; transition: background-color 0.15s ease-in-out;}

        button:hover { background-color: #629924; }

        button:disabled { background-color: #ccc; cursor: not-allowed; }

        #log { margin-top: 1.5rem; background: #22201b; color: #bababa; padding: 1rem; border-radius: 4px; font-family: monospace; white-space: pre-wrap; max-height: 300px; overflow-y: auto; }

        .stats { margin-top: 1rem; font-weight: bold; }

    </style>

</head>

<body>



<div class="container">

    <h1>Xtractor for Lichess™</h1>

    

    <label for="username">Lichess Username</label>

    <input type="text" id="username" placeholder="e.g. MagnusCarlsen">



    <label for="count">Number of Games</label>

    <input type="number" id="count" value="100" min="1" max="10000">



    <button id="btnFetch">Download Games</button>



    <div id="log">Status: Ready</div>

</div>



<script>

    const btn = document.getElementById('btnFetch');

    const logDiv = document.getElementById('log');



    function log(msg) {

        logDiv.textContent += msg + "\n";

        logDiv.scrollTop = logDiv.scrollHeight; // Auto-scroll to bottom

    }



    btn.addEventListener('click', async () => {

        const username = document.getElementById('username').value.trim();

        const count = document.getElementById('count').value;



        if (!username) {

            alert("Please enter a username");

            return;

        }



        // Reset UI

        logDiv.textContent = "";

        btn.disabled = true;

        btn.textContent = "Fetching...";

        

        try {

            log(`Connecting to Lichess API for user: ${username}...`);



            // Build URL

            const params = new URLSearchParams({

                max: count,

                pgnInJson: 'true',

                clocks: 'false',

                opening: 'true',

                perfType: 'rapid,blitz,bullet'

            });

            const url = `https://lichess.org/api/games/user/${username}?${params.toString()}`;



            // Fetch Request

            const response = await fetch(url, {

                headers: { 'Accept': 'application/x-ndjson' }

            });



            if (!response.ok) {

                if(response.status === 404) throw new Error("User not found.");

                else throw new Error(`API Error: ${response.status}`);

            }



            // Stream Reader setup

            const reader = response.body.getReader();

            const decoder = new TextDecoder("utf-8");

            let buffer = "";

            const gamesList = [];

            let loop = true;



            log("Stream connected. Downloading...");



            while (loop) {

                const { done, value } = await reader.read();

                if (done) loop = false;



                // Decode chunk

                const chunk = value ? decoder.decode(value, { stream: true }) : "";

                buffer += chunk;

                

                // Split by newline

                const lines = buffer.split("\n");

                

                // Keep the last incomplete line in the buffer

                buffer = lines.pop();



                for (const line of lines) {

                    if (line.trim()) {

                        try {

                            const game = JSON.parse(line);

                            gamesList.push(game);

                            

                            // Update UI every 50 games so it doesn't freeze

                            if (gamesList.length % 50 === 0) {

                                log(`Extracted ${gamesList.length} games...`);

                            }

                        } catch (e) {

                            console.warn("Skipped malformed line");

                        }

                    }

                }

            }



            // Process any leftovers

            if (buffer.trim()) {

                try { gamesList.push(JSON.parse(buffer)); } catch(e) {}

            }



            log(`\nFinished! Total games: ${gamesList.length}`);

            

            // Calculate Stats

            calcStats(gamesList, username);



            // Trigger File Download

            downloadFile(gamesList, username);



        } catch (error) {

            log(`\nERROR: ${error.message}`);

        } finally {

            btn.disabled = false;

            btn.textContent = "Download Games";

        }

    });



    function calcStats(games, username) {

        if (games.length === 0) return;

        

        let wins = 0, losses = 0, draws = 0;

        

        games.forEach(g => {

            // Figure out which color the user played

            // Lichess data structure: g.players.white.user.name

            let myColor = 'black';

            if (g.players.white.user && g.players.white.user.name.toLowerCase() === username.toLowerCase()) {

                myColor = 'white';

            }



            if (!g.winner) draws++;

            else if (g.winner === myColor) wins++;

            else losses++;

        });



        log(`\n--- Session Stats ---\nWins: ${wins}\nLosses: ${losses}\nDraws: ${draws}`);

    }



    function downloadFile(data, username) {

        log("Generating JSON file...");

        const jsonStr = JSON.stringify(data, null, 2);

        const blob = new Blob([jsonStr], { type: "application/json" });

        const url = URL.createObjectURL(blob);

        

        const a = document.createElement('a');

        a.href = url;

        a.download = `lichess_${username}.json`;

        document.body.appendChild(a);

        a.click();

        document.body.removeChild(a);

        URL.revokeObjectURL(url);

        log("File downloaded.");

    }

</script>



</body>

</html>
